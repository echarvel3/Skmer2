name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: ${{ matrix.python-version }}
          channels: conda-forge,bioconda
          channel-priority: strict
      - name: Install dependencies
        shell: bash -el {0}
        run: |
          conda install -y numpy pandas scipy pyfastx kmer-jellyfish=2.3.1 mash=2.3 seqkit pytest pytest-cov
          pip install -e .
      - name: Unit and integration tests
        shell: bash -el {0}
        run: pytest --cov=skmer
      - name: skmer test
        shell: bash -el {0}
        run: skmer test
